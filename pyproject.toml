[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-aware-predictive-maintenance"
version = "1.0.0"
description = "Auditable SPC, machine-learning, and optimization workflow for predictive maintenance"
readme = "README_EN.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Doyun Shin"}
]
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
analysis = [
  "jupyterlab>=4,<5",
  "matplotlib>=3.9,<4",
  "scipy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
